name: GitHub Pages デプロイ

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを1つに制限（進行中のデプロイはキャンセルしない）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: ビルド
    runs-on: ubuntu-latest
    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 依存パッケージをインストール
        run: npm ci

      - name: GitHub Pages 用にビルド
        run: npm run build
        env:
          # 静的エクスポートモードを有効化（GitHub Pages 専用）
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_IS_STATIC: "true"
          # リポジトリ名が「-」の場合: https://<user>.github.io/-/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Anthropic API キー（リポジトリの Settings > Secrets > Actions で設定）
          # ⚠️ NEXT_PUBLIC_ のため静的 HTML に含まれます。個人利用・デモ用途向けです
          NEXT_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.NEXT_PUBLIC_ANTHROPIC_API_KEY }}

      - name: GitHub Pages アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: デプロイ
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
